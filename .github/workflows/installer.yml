name: Installer

on:
  pull_request:
    paths:
      - .github/workflows/installer.yml
      - _tests/**
      - install.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/installer.yml
      - _tests/**
      - install.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: sh -n install.sh _tests/install.sh _tests/fixtures/curl _tests/fixtures/uname

      - name: Lint shell scripts
        run: shellcheck -s sh install.sh _tests/install.sh _tests/fixtures/curl _tests/fixtures/uname

      - name: Test installer
        run: sh _tests/install.sh

      - name: Check diff hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  macos:
    name: macOS (BSD userland)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test portable installer
        run: sh _tests/install.sh
