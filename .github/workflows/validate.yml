name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate HTML
        run: npx --yes html-validate@11.11.0 --max-warnings 0 index.html

      - name: Validate site semantics and assets
        run: python3 scripts/validate_site.py

      - name: Validate installer
        run: |
          bash -n install.sh
          shellcheck install.sh

      - name: Check whitespace and validator purity
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
          test -z "$(git status --porcelain)"
